# One block per model. Change one thing at a time and record why in docs/decision_log.md.
seeds: [0, 1, 2, 3, 4]

nmf:                        # fast classical baseline
  n_topics: 20
  min_df: 5
  max_df: 0.5
  max_features: 50_000
  ngram_range: [1, 2]
  init: nndsvda
  max_iter: 300
  top_n_words: 10

lda:
  n_topics: 20
  passes: 5
  alpha: 0.1 # 0.1 to force documents to be highly specific as text inputs are short
  eta: null
  workers: 2
  add_bigrams: false
  no_below: 5
  no_above: 0.5
  top_n_words: 10

bertopic:
  embedding_model: all-MiniLM-L6-v2
  umap_n_neighbors: 15
  umap_n_components: 5
  min_cluster_size: 50
  min_samples: null
  ngram_range: [1, 2]
  min_df: 5
  nr_topics: 20
  top_n_words: 10

keynmf:
  embedding_model: all-MiniLM-L6-v2
  n_components: 20
  top_n_words: 10
  min_confidence: 0.00
