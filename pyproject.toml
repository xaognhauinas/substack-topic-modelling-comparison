[project]
name = "substack-topics"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas", 
    "numpy", 
    "kagglehub",
    "fastparquet",
    "scikit-learn", 
    "langdetect",
    "gensim", 
    "spacy",
    "bertopic", 
    "turftopic", 
    "sentence-transformers",
    "fasttext-wheel", 
    "beautifulsoup4", 
    "matplotlib", 
    "seaborn",
    "ipykernel",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]