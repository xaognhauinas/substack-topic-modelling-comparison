[project]
name = "substack-topics"
version = "0.1.0"
description = "Comparative analysis of topic modelling approaches on 3.5M Substack posts"
authors = [{name = "xaognhauinas", email = ""}]
license = {text = "MIT"}
requires-python = "3.12"
dependencies = [
    "pandas", 
    "numpy", 
    "kagglehub",
    "fastparquet",
    "scikit-learn", 
    "langdetect",
    "gensim", 
    "spacy",
    "bertopic", 
    "turftopic", 
    "sentence-transformers",
    "fasttext-wheel", 
    "beautifulsoup4", 
    "matplotlib", 
    "seaborn",
    "plotly",
    "streamlit",
    "python-dotenv",
    "pyprojroot",
    "ipykernel",
]

[project.urls]
Homepage = "https://github.com/xaognhauinas/substack-topic-modelling-comparison"
Repository = "https://github.com/xaognhauinas/substack-topic-modelling-comparison"
"Live Demo" = "https://substack-topic-modelling-comparison-a9tahluuxg8pvf8grjzzwc.streamlit.app/"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]